<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banking Quant Master — Learn, Practice, Calculate, Win</title>
<meta name="description" content="Interactive Quantitative Aptitude learning and speed-training system for SBI Clerk, IBPS Clerk and IBPS RRB Office Assistant.">
<meta name="theme-color" content="#16233F">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/calculator.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Banking Quant Master<span class="tag">Learn · Practice · Calculate · Win</span></div>
    <div class="topbar-actions">
      <button class="topbar-calc-btn" id="calc-toggle-btn" title="Open Animated Calculator (C)" aria-label="Open Calculator">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="4"></rect>
          <line x1="7" x2="17" y1="8" y2="8"></line>
          <line x1="7" x2="9" y1="12" y2="12"></line>
          <line x1="11" x2="13" y1="12" y2="12"></line>
          <line x1="15" x2="17" y1="12" y2="12"></line>
          <line x1="7" x2="9" y1="16" y2="16"></line>
          <line x1="11" x2="13" y1="16" y2="16"></line>
          <line x1="15" x2="17" y1="16" y2="16"></line>
        </svg>
        <span>Calculator</span>
      </button>
      <button class="theme-toggle-btn" id="theme-toggle" title="Toggle Light / Dark Mode" aria-label="Toggle Theme">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </div>
</header>
<nav class="mainnav"><div class="inner" id="mainnav-inner"></div></nav>

<div id="app-shell">
  <main><div id="app-content"></div></main>
  <footer class="foot">
    Built for SBI Clerk · IBPS Clerk · IBPS RRB Office Assistant preparation. All progress data stays in your browser.
    See <a href="#/sources">Sources</a> for exam-pattern verification status.
  </footer>
</div>

<!-- Animated Modern Calculator Modal -->
<div class="calc-modal-backdrop" id="calcModal" role="dialog" aria-modal="true" aria-label="Modern Desktop Calculator">
  <div class="calc-window" id="calcWindow">
    <header class="calc-titlebar">
      <div class="titlebar-left">
        <div class="app-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="4"></rect>
            <line x1="7" x2="17" y1="8" y2="8"></line>
            <line x1="7" x2="9" y1="12" y2="12"></line>
            <line x1="11" x2="13" y1="12" y2="12"></line>
            <line x1="15" x2="17" y1="12" y2="12"></line>
            <line x1="7" x2="9" y1="16" y2="16"></line>
            <line x1="11" x2="13" y1="16" y2="16"></line>
            <line x1="15" x2="17" y1="16" y2="16"></line>
          </svg>
        </div>
        <span class="app-title">ULTRA CALC <span class="version-tag">v1.0</span></span>
      </div>
      <div class="titlebar-right">
        <button class="win-btn icon-audio" id="soundToggleBtn" title="Toggle Sound Feedback (S)" aria-label="Toggle Sound">
          <svg class="icon-sound-on" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="icon-sound-off hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" x2="17" y1="9" y2="15"></line>
            <line x1="17" x2="23" y1="9" y2="15"></line>
          </svg>
        </button>
        <button class="win-btn win-minimize" id="btnMinimize" title="Minimize / Hide (Esc)">─</button>
        <button class="win-btn win-close" id="btnClose" title="Close Calculator (Esc)">✕</button>
      </div>
    </header>

    <section class="calc-display-card" id="displayCard">
      <div class="display-top-row">
        <span class="calc-expression" id="expressionDisplay">0</span>
        <div class="display-quick-actions">
          <button class="display-action-btn" id="btnDisplayClear" title="Clear (Escape)">AC</button>
          <button class="display-action-btn" id="btnDisplayBack" title="Delete Last Digit (Backspace)">⌫</button>
        </div>
      </div>
      <div class="display-divider"></div>
      <div class="display-bottom-row">
        <span class="calc-result" id="mainDisplay">0</span>
      </div>
    </section>

    <div class="calc-body">
      <aside class="calc-sidebar">
        <div class="history-card" id="historyCard">
          <div class="history-card-header">
            <span class="history-card-title">History</span>
          </div>
          <div class="history-items-container" id="historyList"></div>
          <div class="history-footer">
            <button class="history-clear-link" id="historyClearBtn">Clear history</button>
          </div>
        </div>

        <div class="scientific-toggle-section">
          <span class="sci-toggle-label">Scientific</span>
          <div class="pill-toggle" id="sciToggle" title="Toggle Scientific Keypad (F)">
            <span class="pill-label pill-std active">STD</span>
            <div class="pill-slider-track">
              <div class="pill-slider-thumb" id="pillThumb"></div>
            </div>
            <span class="pill-label pill-sci">SCI</span>
          </div>
        </div>

        <div class="scientific-flyout hidden" id="scientificFlyout">
          <button class="sci-btn" data-action="sci" data-val="sin">sin</button>
          <button class="sci-btn" data-action="sci" data-val="cos">cos</button>
          <button class="sci-btn" data-action="sci" data-val="tan">tan</button>
          <button class="sci-btn" data-action="sci" data-val="sqrt">√</button>
          <button class="sci-btn" data-action="operator" data-val="^">xʸ</button>
          <button class="sci-btn" data-action="sci" data-val="pi">π</button>
          <button class="sci-btn" data-action="sci" data-val="e">e</button>
          <button class="sci-btn" data-action="sci" data-val="log">log</button>
        </div>
      </aside>

      <main class="calc-keypad" id="keypad">
        <button class="calc-btn btn-num" data-action="number" data-val="7">7</button>
        <button class="calc-btn btn-num" data-action="number" data-val="8">8</button>
        <button class="calc-btn btn-num" data-action="number" data-val="9">9</button>
        <button class="calc-btn btn-op" data-action="operator" data-val="/" title="Divide">÷</button>

        <button class="calc-btn btn-num" data-action="number" data-val="4">4</button>
        <button class="calc-btn btn-num" data-action="number" data-val="5">5</button>
        <button class="calc-btn btn-num" data-action="number" data-val="6">6</button>
        <button class="calc-btn btn-op" data-action="operator" data-val="*" title="Multiply">×</button>

        <button class="calc-btn btn-num" data-action="number" data-val="1">1</button>
        <button class="calc-btn btn-num" data-action="number" data-val="2">2</button>
        <button class="calc-btn btn-num" data-action="number" data-val="3">3</button>
        <button class="calc-btn btn-op" data-action="operator" data-val="-" title="Subtract">−</button>

        <button class="calc-btn btn-num" data-action="number" data-val="0">0</button>
        <button class="calc-btn btn-num" data-action="decimal" data-val=".">.</button>
        <button class="calc-btn btn-equals" data-action="calculate" id="btnEquals" title="Equals">=</button>
        <button class="calc-btn btn-op" data-action="operator" data-val="+" title="Add">+</button>
      </main>
    </div>
  </div>
</div>

<script src="js/data/topics.js"></script>
<script src="js/data/shortcuts.js"></script>
<script src="js/data/generators.js"></script>
<script src="js/data/mindtricks.js"></script>
<script src="js/storage.js"></script>
<script src="js/calculator.js"></script>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
