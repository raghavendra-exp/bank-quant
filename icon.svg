<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16233F"/>
      <stop offset="100%" stop-color="#0D1626"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4CB9C"/>
      <stop offset="50%" stop-color="#B8863E"/>
      <stop offset="100%" stop-color="#8C6226"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#navyGrad)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="8 6"/>
  <!-- Ledger Passbook & Math Symbols -->
  <rect x="130" y="110" width="252" height="292" rx="20" fill="#F3EFE4" stroke="url(#goldGrad)" stroke-width="8"/>
  <line x1="160" y1="180" x2="352" y2="180" stroke="#D8CFB8" stroke-width="4"/>
  <line x1="160" y1="230" x2="352" y2="230" stroke="#D8CFB8" stroke-width="4"/>
  <line x1="160" y1="280" x2="352" y2="280" stroke="#D8CFB8" stroke-width="4"/>
  <line x1="160" y1="330" x2="352" y2="330" stroke="#D8CFB8" stroke-width="4"/>
  <!-- Centered Stamp Emblem -->
  <circle cx="256" cy="256" r="64" fill="#16233F" stroke="url(#goldGrad)" stroke-width="6"/>
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="bold" fill="#E4CB9C" text-anchor="middle">Q</text>
